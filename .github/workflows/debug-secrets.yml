name: Debug macOS Signing & Notarization

on:
  workflow_dispatch: # manual trigger from GitHub UI

jobs:
  debug:
    runs-on: macos-latest

    steps:
      - name: Check if secrets exist (safe)
        run: |
          echo "MAC_CERTS length: ${#MAC_CERTS}"
          echo "MAC_CERTS_PASSWORD set: $([[ -n \"$MAC_CERTS_PASSWORD\" ]] && echo YES || echo NO)"
          echo "API_KEY length: ${#API_KEY}"
          echo "API_KEY_ID: $API_KEY_ID"
          echo "APPLE_API_ISSUER: $APPLE_API_ISSUER"
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.API_KEY_ISSUER_ID }}

      # ─────────────────────────────────────────────
      # Decode and install certificate
      # ─────────────────────────────────────────────
      - name: Install certificate
        run: |
          echo "$MAC_CERTS" | base64 --decode > cert.p12

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

          security import cert.p12 \
            -k build.keychain \
            -P "$MAC_CERTS_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" build.keychain
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}

      # ─────────────────────────────────────────────
      # Verify certificate
      # ─────────────────────────────────────────────
      - name: List signing identities
        run: security find-identity -v -p codesigning || true

      # ─────────────────────────────────────────────
      # Check Apple API key
      # ─────────────────────────────────────────────
      - name: Validate Apple API key file
        run: |
          echo "$API_KEY" > apple.p8
          ls -l apple.p8
          head -n 3 apple.p8
        env:
          API_KEY: ${{ secrets.API_KEY }}