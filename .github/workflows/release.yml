name: Build/release Electron app
on:
    push:
        tags:
            - 'v*.*.*'
jobs:
    release:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      platform: mac
                      arch: universal
                    - os: ubuntu-latest
                      platform: linux
                      arch: x64
                    - os: ubuntu-24.04-arm
                      platform: linux
                      arch: arm64
                    - os: windows-latest
                      platform: windows
                      arch: x64
                    - os: windows-11-arm
                      platform: windows
                      arch: arm64
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v3

            - name: Install system FPM (Linux ARM64)
              if: matrix.platform == 'linux' && matrix.arch == 'arm64'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ruby ruby-dev rubygems build-essential
                  sudo gem install --no-document fpm

            - name: Install Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Install macOS x64 native module
              if: matrix.platform == 'mac'
              run: npm install --save-dev @miniben90/x-win-darwin-x64 --force

            - name: Fix app-builder executable permissions (Linux)
              if: matrix.platform == 'linux'
              run: find node_modules/app-builder-bin -type f -name "app-builder" -exec chmod +x {} \;

            - name: Build
              run: npm run build

            - name: Run Electron Builder (Windows)
              if: matrix.platform == 'windows'
              run: npx electron-builder --windows --${{ matrix.arch }} --publish always
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}

            - name: Run Electron Builder (Linux)
              if: matrix.platform == 'linux'
              run: npx electron-builder --linux --${{ matrix.arch }} --publish always
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
                  USE_SYSTEM_FPM: ${{ matrix.arch == 'arm64' && 'true' || 'false' }}
            
            # TODO: re-enable for testing purposes no signing needed
            # - name: Run Electron Builder (macOS)
            #   if: matrix.platform == 'mac'
            #   run: |
            #       npx electron-builder --mac --universal --publish always
            #   env:
            #       GH_TOKEN: ${{ secrets.GH_TOKEN }}
            #       CSC_IDENTITY_AUTO_DISCOVERY: false
                  
            - name: Run Electron Builder (macOS)
              if: matrix.platform == 'mac'
              run: |
                  if [ -n "$API_KEY" ]; then
                    echo "$API_KEY" > apple.p8
                  fi
                  npx electron-builder --mac --universal --publish always
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
                  CSC_LINK: ${{ secrets.MAC_CERTS }}
                  CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
                  API_KEY: ${{ secrets.API_KEY }}
                  APPLE_API_KEY: ${{ secrets.API_KEY != '' && 'apple.p8' || '' }}
                  APPLE_API_KEY_ID: ${{ secrets.API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.API_KEY_ISSUER_ID }}
            

          # ----------------------------------------------------------------
            # Upload release assets to Cloudflare R2
            # ----------------------------------------------------------------
            # Files are uploaded to: releases/<tag>/<filename>
            # e.g. releases/v0.0.1/tabi-Setup-0.0.1.exe
            # Only installer files are uploaded — .blockmap files are skipped.
            # ----------------------------------------------------------------
            - name: Install AWS CLI (for R2 upload)
              if: secrets.R2_BUCKET_NAME != ''
              run: pip install awscli

            - name: Upload to Cloudflare R2 (Windows)
              if: matrix.platform == 'windows' && secrets.R2_BUCKET_NAME != ''
              shell: bash
              run: |
                  TAG=${GITHUB_REF#refs/tags/}
                  aws s3 cp dist/ s3://${{ secrets.R2_BUCKET_NAME }}/releases/$TAG/ \
                    --recursive \
                    --exclude "*" \
                    --include "*.exe" \
                    --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
                    --no-progress
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: auto
 
            - name: Upload to Cloudflare R2 (Linux)
              if: matrix.platform == 'linux' && secrets.R2_BUCKET_NAME != ''
              run: |
                  TAG=${GITHUB_REF#refs/tags/}
                  aws s3 cp dist/ s3://${{ secrets.R2_BUCKET_NAME }}/releases/$TAG/ \
                    --recursive \
                    --exclude "*" \
                    --include "*.AppImage" \
                    --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
                    --no-progress
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: auto
 
            - name: Upload to Cloudflare R2 (macOS)
              if: matrix.platform == 'mac' && secrets.R2_BUCKET_NAME != ''
              run: |
                  TAG=${GITHUB_REF#refs/tags/}
                  aws s3 cp dist/ s3://${{ secrets.R2_BUCKET_NAME }}/releases/$TAG/ \
                    --recursive \
                    --exclude "*" \
                    --include "*.dmg" \
                    --include "*.zip" \
                    --exclude "*.blockmap" \
                    --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
                    --no-progress
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: auto
 