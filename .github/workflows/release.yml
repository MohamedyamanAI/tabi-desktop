name: Build/release Electron app

# ─────────────────────────────────────────────────────────────────────────────
# Release Strategy
# ─────────────────────────────────────────────────────────────────────────────
# First install (download from website):
#   → Files stored in Cloudflare R2 at releases/latest/ (stable URLs, no versioning)
#   → Web app download button always points to:
#       https://pub-xxx.r2.dev/releases/latest/tabi-Setup.exe          (Windows x64)
#       https://pub-xxx.r2.dev/releases/latest/tabi-Setup-arm64.exe    (Windows ARM64)
#       https://pub-xxx.r2.dev/releases/latest/tabi-universal.dmg      (macOS universal)
#       https://pub-xxx.r2.dev/releases/latest/tabi.AppImage           (Linux x64)
#       https://pub-xxx.r2.dev/releases/latest/tabi-arm64.AppImage     (Linux ARM64)
#
# Auto-update (existing installs):
#   → electron-updater reads latest.yml from Cloudflare R2 (not GitHub)
#   → GitHub repo is private so electron-updater cannot read GitHub releases
#   → latest.yml is uploaded to R2 alongside the installers
#   → package.json publish.url points to R2
# ─────────────────────────────────────────────────────────────────────────────

on:
    push:
        tags:
            - 'v*.*.*'
jobs:
    release:
        runs-on: ${{ matrix.os }}
        env:
            R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      platform: mac
                      arch: universal
                    - os: ubuntu-latest
                      platform: linux
                      arch: x64
                    - os: ubuntu-24.04-arm
                      platform: linux
                      arch: arm64
                    - os: windows-latest
                      platform: windows
                      arch: x64
                    - os: windows-11-arm
                      platform: windows
                      arch: arm64
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v3

            - name: Install system FPM (Linux ARM64)
              if: matrix.platform == 'linux' && matrix.arch == 'arm64'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ruby ruby-dev rubygems build-essential
                  sudo gem install --no-document fpm

            - name: Install Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Install macOS x64 native module
              if: matrix.platform == 'mac'
              run: npm install --save-dev @miniben90/x-win-darwin-x64 --force

            - name: Fix app-builder executable permissions (Linux)
              if: matrix.platform == 'linux'
              run: find node_modules/app-builder-bin -type f -name "app-builder" -exec chmod +x {} \;

            - name: Build
              run: npm run build

            - name: Run Electron Builder (Windows)
              if: matrix.platform == 'windows'
              run: npx electron-builder --windows --${{ matrix.arch }} --publish always
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}

            - name: Run Electron Builder (Linux)
              if: matrix.platform == 'linux'
              run: npx electron-builder --linux --${{ matrix.arch }} --publish always
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
                  USE_SYSTEM_FPM: ${{ matrix.arch == 'arm64' && 'true' || 'false' }}

            - name: Import code signing certificate
              if: matrix.platform == 'mac'
              run: |
                  echo "$CSC_LINK" | base64 --decode > certificate.p12
                  security create-keychain -p actions build.keychain
                  security default-keychain -s build.keychain
                  security unlock-keychain -p actions build.keychain
                  security import certificate.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
                  security find-identity -v -p codesigning build.keychain
                  rm certificate.p12
              env:
                  CSC_LINK: ${{ secrets.MAC_CERTS }}
                  CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}

            - name: Run Electron Builder (macOS)
              if: matrix.platform == 'mac'
              run: |
                  echo "$API_KEY" | base64 --decode > apple.p8
                  npx electron-builder --mac --universal --publish always
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
                  CSC_LINK: ${{ secrets.MAC_CERTS }}
                  CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
                  API_KEY: ${{ secrets.API_KEY }}
                  APPLE_API_KEY: apple.p8
                  APPLE_API_KEY_ID: ${{ secrets.API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.API_KEY_ISSUER_ID }}

            # ── Upload to Cloudflare R2 (latest/ only) ───────────────────────
            # Uploads installers AND latest.yml update metadata to R2.
            # electron-updater reads latest.yml from R2 to detect new versions
            # since the GitHub repo is private and cannot be read without a token.

            - name: Install AWS CLI (for R2 upload)
              if: env.R2_BUCKET_NAME != ''
              run: pip install awscli

            - name: Upload latest installer to R2 (Windows)
              if: matrix.platform == 'windows' && env.R2_BUCKET_NAME != ''
              shell: bash
              run: |
                  R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
                  if [ "${{ matrix.arch }}" = "arm64" ]; then
                    STABLE_NAME="tabi-Setup-arm64.exe"
                  else
                    STABLE_NAME="tabi-Setup.exe"
                  fi

                  # Upload installer
                  for f in dist/*.exe; do
                    [ -f "$f" ] || continue
                    [[ "$f" == *.blockmap ]] && continue
                    echo "Uploading $f → releases/latest/$STABLE_NAME"
                    aws s3 cp "$f" s3://${{ secrets.R2_BUCKET_NAME }}/releases/latest/$STABLE_NAME \
                      --endpoint-url $R2_ENDPOINT \
                      --no-progress
                  done

                  # Upload update metadata (x64 only — one latest.yml per platform)
                  if [ "${{ matrix.arch }}" = "x64" ] && [ -f dist/latest.yml ]; then
                    echo "Uploading dist/latest.yml → releases/latest/latest.yml"
                    aws s3 cp dist/latest.yml s3://${{ secrets.R2_BUCKET_NAME }}/releases/latest/latest.yml \
                      --endpoint-url $R2_ENDPOINT \
                      --no-progress
                  fi
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: auto

            - name: Upload latest installer to R2 (Linux)
              if: matrix.platform == 'linux' && env.R2_BUCKET_NAME != ''
              run: |
                  R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
                  if [ "${{ matrix.arch }}" = "arm64" ]; then
                    STABLE_NAME="tabi-arm64.AppImage"
                  else
                    STABLE_NAME="tabi.AppImage"
                  fi

                  # Upload installer
                  for f in dist/*.AppImage; do
                    [ -f "$f" ] || continue
                    echo "Uploading $f → releases/latest/$STABLE_NAME"
                    aws s3 cp "$f" s3://${{ secrets.R2_BUCKET_NAME }}/releases/latest/$STABLE_NAME \
                      --endpoint-url $R2_ENDPOINT \
                      --no-progress
                  done

                  # Upload update metadata (x64 only — one latest-linux.yml)
                  if [ "${{ matrix.arch }}" = "x64" ] && [ -f dist/latest-linux.yml ]; then
                    echo "Uploading dist/latest-linux.yml → releases/latest/latest-linux.yml"
                    aws s3 cp dist/latest-linux.yml s3://${{ secrets.R2_BUCKET_NAME }}/releases/latest/latest-linux.yml \
                      --endpoint-url $R2_ENDPOINT \
                      --no-progress
                  fi
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: auto

            - name: Upload latest installer to R2 (macOS)
              if: matrix.platform == 'mac' && env.R2_BUCKET_NAME != ''
              run: |
                  R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

                  # Upload .dmg installer
                  for f in dist/*.dmg; do
                    [ -f "$f" ] || continue
                    echo "Uploading $f → releases/latest/tabi-universal.dmg"
                    aws s3 cp "$f" s3://${{ secrets.R2_BUCKET_NAME }}/releases/latest/tabi-universal.dmg \
                      --endpoint-url $R2_ENDPOINT \
                      --no-progress
                  done

                  # Upload .zip installer
                  for f in dist/*.zip; do
                    [ -f "$f" ] || continue
                    [[ "$f" == *.blockmap ]] && continue
                    echo "Uploading $f → releases/latest/tabi-universal-mac.zip"
                    aws s3 cp "$f" s3://${{ secrets.R2_BUCKET_NAME }}/releases/latest/tabi-universal-mac.zip \
                      --endpoint-url $R2_ENDPOINT \
                      --no-progress
                  done

                  # Upload update metadata
                  if [ -f dist/latest-mac.yml ]; then
                    echo "Uploading dist/latest-mac.yml → releases/latest/latest-mac.yml"
                    aws s3 cp dist/latest-mac.yml s3://${{ secrets.R2_BUCKET_NAME }}/releases/latest/latest-mac.yml \
                      --endpoint-url $R2_ENDPOINT \
                      --no-progress
                  fi
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: auto