name: NPM Build

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: 'Checkout code'
              uses: actions/checkout@v4

            - name: 'Install Linux native build deps (uiohook-napi / X11)'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    build-essential \
                    libx11-dev \
                    libxtst-dev \
                    libxt-dev \
                    libxrandr-dev \
                    libxinerama-dev \
                    libxi-dev

            - name: 'Use Node.js'
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'

            - name: 'Install npm dependencies'
              run: npm ci

            - name: 'Build'
              run: npm run build
