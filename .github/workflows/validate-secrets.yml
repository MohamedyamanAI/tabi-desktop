name: Validate Secrets

on:
    workflow_dispatch:

jobs:
    validate:
        runs-on: macos-latest
        steps:
            - name: Validate MAC_CERTS (base64 decode)
              id: mac_certs
              continue-on-error: true
              run: |
                  if [ -z "$MAC_CERTS" ]; then
                    echo "❌ MAC_CERTS: not set"
                    exit 1
                  fi
                  echo "$MAC_CERTS" | base64 --decode > cert.p12 && echo "✅ MAC_CERTS: valid base64" || (echo "❌ MAC_CERTS: invalid base64"; exit 1)
              env:
                  MAC_CERTS: ${{ secrets.MAC_CERTS }}

            - name: Validate MAC_CERTS_PASSWORD (unlock cert)
              id: mac_certs_password
              continue-on-error: true
              run: |
                  if [ -z "$MAC_CERTS_PASSWORD" ]; then
                    echo "❌ MAC_CERTS_PASSWORD: not set"
                    exit 1
                  fi
                  if [ ! -f cert.p12 ]; then
                    echo "⚠️  MAC_CERTS_PASSWORD: skipped (cert.p12 not available)"
                    exit 0
                  fi
                  openssl pkcs12 -in cert.p12 -passin "pass:$MAC_CERTS_PASSWORD" -noout 2>&1 && echo "✅ MAC_CERTS_PASSWORD: correct" || (echo "❌ MAC_CERTS_PASSWORD: incorrect"; exit 1)
              env:
                  MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}

            - name: Print certificate identity and expiry
              continue-on-error: true
              run: |
                  if [ ! -f cert.p12 ]; then
                    echo "⚠️  Certificate info: skipped (cert.p12 not available)"
                    exit 0
                  fi
                  openssl pkcs12 -in cert.p12 -passin "pass:$MAC_CERTS_PASSWORD" -nokeys 2>/dev/null | \
                    openssl x509 -noout -subject -enddate 2>/dev/null | \
                    sed 's/subject=/Subject: /' | sed 's/notAfter=/Expires: /' || echo "⚠️  Could not parse certificate details"
              env:
                  MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}

            - name: Validate API_KEY (base64 decode)
              id: api_key
              continue-on-error: true
              run: |
                  if [ -z "$API_KEY" ]; then
                    echo "❌ API_KEY: not set"
                    exit 1
                  fi
                  echo "$API_KEY" | base64 --decode > api.p8
                  if head -1 api.p8 | grep -q "PRIVATE KEY"; then
                    echo "✅ API_KEY: valid (contains PRIVATE KEY header)"
                  else
                    echo "❌ API_KEY: decoded but missing PRIVATE KEY header"
                    exit 1
                  fi
              env:
                  API_KEY: ${{ secrets.API_KEY }}

            - name: Validate API_KEY_ID
              continue-on-error: true
              run: |
                  if [ -z "$API_KEY_ID" ]; then
                    echo "❌ API_KEY_ID: not set"
                    exit 1
                  fi
                  echo "✅ API_KEY_ID: set (starts with ${API_KEY_ID:0:4}...)"
              env:
                  API_KEY_ID: ${{ secrets.API_KEY_ID }}

            - name: Validate API_KEY_ISSUER_ID
              continue-on-error: true
              run: |
                  if [ -z "$API_KEY_ISSUER_ID" ]; then
                    echo "❌ API_KEY_ISSUER_ID: not set"
                    exit 1
                  fi
                  echo "✅ API_KEY_ISSUER_ID: set (starts with ${API_KEY_ISSUER_ID:0:4}...)"
              env:
                  API_KEY_ISSUER_ID: ${{ secrets.API_KEY_ISSUER_ID }}

            - name: Validate GH_TOKEN (GitHub API access)
              continue-on-error: true
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                    echo "❌ GH_TOKEN: not set"
                    exit 1
                  fi
                  STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    https://api.github.com/repos/MohamedyamanAI/tabi-desktop)
                  if [ "$STATUS" = "200" ]; then
                    echo "✅ GH_TOKEN: valid (repo access confirmed)"
                  else
                    echo "❌ GH_TOKEN: GitHub API returned HTTP $STATUS"
                    exit 1
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}

            - name: Check R2_BUCKET_NAME
              continue-on-error: true
              run: |
                  if [ -z "$R2_BUCKET_NAME" ]; then
                    echo "ℹ️  R2_BUCKET_NAME: not configured (R2 uploads will be skipped)"
                  else
                    echo "✅ R2_BUCKET_NAME: configured"
                  fi
              env:
                  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

            - name: Cleanup decoded files
              if: always()
              run: |
                  rm -f cert.p12 api.p8
                  echo "Cleanup complete"
